<!doctype html>
<meta charset="utf-8">
<title>Pacific Envoy — vessel popup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#e9eef1; --panel:#ffffff; --sub:#f4f7f9; --ink:#16232e; --muted:#5a6b77; --line:#d7e0e6;
    --accent:#0e7c86; --good:#1f9d55; --warn:#c47f17; --bad:#c0392b;
    --own-bow:#2f6f9f; --own-ais:#c47f17; --own-ves:#1f9d55; --own-load:#7d4fd1;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c151d; --panel:#14212c; --sub:#0f1a23; --ink:#e7eef3; --muted:#8ba0ad; --line:#24333f;
    --accent:#38b2bf; --good:#43c07a; --warn:#e0a54a; --bad:#e0705f;
    --own-bow:#5aa0d0; --own-ais:#e0a54a; --own-ves:#43c07a; --own-load:#a684e8;
  }}
  :root[data-theme="dark"]{
    --bg:#0c151d; --panel:#14212c; --sub:#0f1a23; --ink:#e7eef3; --muted:#8ba0ad; --line:#24333f;
    --accent:#38b2bf; --good:#43c07a; --warn:#e0a54a; --bad:#e0705f;
    --own-bow:#5aa0d0; --own-ais:#e0a54a; --own-ves:#43c07a; --own-load:#a684e8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  .wrap{max-width:1180px;margin:0 auto;padding:18px}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .topbar h1{font-size:16px;font-weight:600;margin:0}
  .topbar .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  .tabs{display:flex;gap:6px}
  .tab{padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-weight:500;font-size:13px}
  .tab.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .btn{padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-size:13px}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 12px;font-size:12px;color:var(--muted)}
  .legend b{font-weight:600;color:var(--ink)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  .db{background:var(--own-bow)} .da{background:var(--own-ais)} .dv{background:var(--own-ves)} .dl{background:var(--own-load)}
  .popup{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(10,20,30,.10)}
  .pophead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 18px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(14,124,134,.06),transparent)}
  .pophead .nm{font-size:19px;font-weight:700}
  .pophead .cls{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .pophead .id{font-size:12px;color:var(--muted)}
  .pophead .id b{color:var(--ink);font-weight:600}
  .subtabs{display:flex;gap:4px;padding:10px 16px 0}
  .stab{padding:6px 14px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--sub);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
  .stab.on{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:inset 0 2px 0 var(--accent)}
  .view{border-top:1px solid var(--line);margin-top:-1px}
  .toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px 0;font-size:12px;color:var(--muted)}
  .modebar{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
  .modebadge{font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px}
  .modebar.cur .modebadge{background:rgba(31,157,85,.14);color:var(--good)}
  .modebar.sim .modebadge{background:rgba(196,127,23,.20);color:var(--warn)}
  .modebar .btn[disabled]{opacity:.4;cursor:default}
  .drawing.sim svg{outline:2px solid var(--warn);outline-offset:-1px}
  .chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .drawing{padding:8px 12px 2px}
  .drawing svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px;border:1px solid var(--line)}
  .cap{font-size:11px;color:var(--muted);padding:6px 6px 0}
  /* KPI cards below profile */
  .kpiwrap{padding:6px 16px 16px}
  .kpihdr{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 2px 6px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:9px 11px;position:relative;background:var(--panel)}
  .kpi .k{font-size:11px;color:var(--muted);padding-right:14px}
  .kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi .u{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
  .kpi .stat{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%}
  .kpi .owns{display:none;position:absolute;bottom:8px;right:9px;gap:3px}
  body.showsrc .kpi .owns{display:inline-flex}
  .ot{width:9px;height:9px;border-radius:3px;display:inline-block}
  .s-ok{background:var(--good)} .s-warn{background:var(--warn)} .s-bad{background:var(--bad)} .s-na{background:var(--muted);opacity:.4}
  /* particulars */
  .part{padding:14px 16px}
  .parttab{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  @media(max-width:720px){.parttab{grid-template-columns:1fr}}
  .prow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .prow .k{color:var(--muted)} .prow .v{font-weight:600;font-variant-numeric:tabular-nums}
  /* controls */
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  @media(max-width:820px){.controls{grid-template-columns:1fr 1fr}}
  .col{border-left:3px solid var(--line);padding-left:10px}
  .col h3{font-size:12px;margin:0 0 8px;display:flex;align-items:center;gap:7px}
  .col.bow{border-color:var(--own-bow)} .col.ais{border-color:var(--own-ais)}
  .col.ves{border-color:var(--own-ves)} .col.load{border-color:var(--own-load)}
  .ctl{margin-bottom:9px}
  .ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px}
  .ctl label b{color:var(--ink);font-weight:600}
  .ctl input[type=range]{width:100%;accent-color:var(--accent)}
  .ro{font-size:12px;color:var(--muted);padding:2px 0;display:flex;justify-content:space-between}
  .ro b{color:var(--ink);font-weight:600}
  .note{font-size:12px;color:var(--muted);margin-top:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .note b{color:var(--ink)}
  .srcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
  @media(max-width:820px){.srcgrid{grid-template-columns:1fr 1fr}}
  .srccol h5{margin:0 0 4px;font-size:12px} .srccol ul{margin:0;padding-left:16px}
  .srccol li{font-size:12px;color:var(--muted);margin:1px 0}
</style>

<div class="wrap">
  <div class="topbar">
    <div><h1>Pacific Envoy</h1>
      <div class="sub">Live berthing &amp; clearance readout</div></div>
    <div class="spacer"></div>
    <button class="btn" id="theme">Theme</button>
  </div>

  <div class="popup">
    <div class="pophead" id="pophead"></div>
    <div class="subtabs">
      <div class="stab on" data-v="ops" id="stab-ops">Operating picture</div>
      <div class="stab" data-v="part" id="stab-part">Particulars (per design)</div>
    </div>
    <div class="view" id="view"></div>
  </div>

  <div class="controls" id="controls"></div>
</div>

<script>
/* ============================ data ============================ */
const S=2.4, TH=2.75, B40=12.19, KN=0.5144, RHOA=1.225, RHOW=1025, G=9.81;
const CLASS={
  panamax:{label:'Panamax',teu:'≈ 4,500 TEU',LOA:294,LBP:283,beam:32.2,depth:21.4,Tdes:12.0,disp:66000,
    deckTiers:6,holdTiers:8,rowsDeck:13,airDes:25.9,foreRise:2.2,stemRake:0.045,db:1.9,
    island:'single',houseFrac:0.30,funnelFrac:0.30,houseLen:22,funnelLen:0,holdAft:0.09},
  neo:{label:'Neo-Panamax',teu:'≈ 13,000 TEU',LOA:366,LBP:350,beam:48.2,depth:29.85,Tdes:15.0,disp:160000,
    deckTiers:9,holdTiers:10,rowsDeck:19,airDes:39.6,foreRise:2.6,stemRake:0.014,db:2.2,
    island:'two',houseFrac:0.735,funnelFrac:0.315,houseLen:28,funnelLen:18,holdAft:0.08},
  ulcv:{label:'ULCV',teu:'≈ 24,000 TEU',LOA:400,LBP:383,beam:61.0,depth:33.2,Tdes:16.5,disp:232000,
    deckTiers:12,holdTiers:11,rowsDeck:24,airDes:49.7,foreRise:2.8,stemRake:0.010,db:2.4,
    island:'two',houseFrac:0.805,funnelFrac:0.340,houseLen:30,funnelLen:20,holdAft:0.08},
};
const Cb=c=>c.disp/(RHOW/1000*c.LBP*c.beam*c.Tdes);
const VESSELS=[
 {id:'pacific',name:'Pacific Envoy',cls:'panamax',mmsi:'357042001',imo:'9482134',cs:'3EPX3',flag:'Panama',baplie:'baplie_A_panamax_eastcoast.edi',
   L:{Tf:11.6,Ta:12.2,GM:1.8,tiers:5,fwd:3,fill:0.90}},
 {id:'continental',name:'Continental Bridge',cls:'neo',mmsi:'538071013',imo:'9517769',cs:'V7DB9',flag:'Marshall Is.',baplie:'baplie_B_neopanamax_westcoast.edi',
   L:{Tf:14.4,Ta:14.9,GM:2.6,tiers:8,fwd:5,fill:0.92}},
 {id:'meridian',name:'Meridian Sovereign',cls:'ulcv',mmsi:'563088024',imo:'9633044',cs:'9V6301',flag:'Singapore',baplie:'baplie_C_ulcv_partial.edi',
   L:{Tf:13.8,Ta:14.6,GM:4.2,tiers:9,fwd:6,fill:0.72}},
];
const ENV={windKn:18,windDir:90,curKn:0.5,tide:1.2,chartDepth:16.5,overhead:62,sogKn:0,cog:284,heading:286};
let cur=0, sub='ops';
const opts={hold:true,wind:true,sight:true,labels:false};
const SEL=new Set();   // bays whose air draft is shown — click a bay to toggle
const BASE={env:{...ENV}, load:VESSELS.map(v=>({...v.L}))};
function isSim(){for(const k in BASE.env) if(ENV[k]!==BASE.env[k]) return true;
  const bl=BASE.load[cur],cl=VESSELS[cur].L; for(const k in bl) if(cl[k]!==bl[k]) return true; return false;}

/* ============================ calc ============================ */
function calc(v,env){
  const c=CLASS[v.cls], L=v.L, cb=Cb(c);
  const Tm=(L.Tf+L.Ta)/2, trim=L.Ta-L.Tf, fb=c.depth-Tm;
  const Ahull=c.LOA*fb*0.90, stackLen=L.fill*0.88*c.LOA, Astk=stackLen*(L.tiers*TH);
  const houseAbove=L.tiers*TH+4, Asuper=26*houseAbove+(c.island==='two'?20*houseAbove*0.8:0);
  const AL=Ahull+Astk+Asuper;
  const Vw=env.windKn*KN, bfac=Math.abs(Math.sin(env.windDir*Math.PI/180));
  const Fwind=0.5*RHOA*1.0*AL*Math.pow(Vw*bfac,2);
  const ALu=c.LOA*Tm*0.9, Fcur=0.5*RHOW*1.0*ALu*Math.pow(env.curKn*KN*bfac,2);
  const Ftot=Fwind+Fcur, BP=60*G*1000, tugs=Math.max(0,Math.ceil(Ftot*1.5/BP));
  const lever=fb+0.40*L.tiers*TH, Mheel=Fwind*lever;
  const heelDeg=Mheel/(c.disp*1000*G*L.GM)*180/Math.PI;
  const heelImm=(c.beam/2)*Math.sin(heelDeg*Math.PI/180);
  const squat=cb*Math.pow(env.sogKn,2)/100;
  const Tgov=Math.max(L.Tf,L.Ta)+heelImm, reqUKC=Math.max(1.0,0.10*Tgov);
  const UKC=env.chartDepth+env.tide-(Tgov+squat), maxDraft=env.chartDepth+env.tide-reqUKC;
  const airDraft=fb+L.tiers*TH+12;   // to masthead: house(+4)+mast/antenna(+8) — governs over any container bay
  const eyeAbvWL=fb+(houseAbove-3), Ho=fb+L.fwd*TH, xo=(0.93-c.houseFrac)*c.LOA;
  let blind=eyeAbvWL>Ho?eyeAbvWL*xo/(eyeAbvWL-Ho)-(0.97-c.houseFrac)*c.LOA:Infinity;
  const visLimit=Math.min(2*c.LOA,500);
  return {c,cb,Tm,trim,fb,AL,Fwind,Fcur,Ftot,tugs,heelDeg,heelImm,squat,Tgov,reqUKC,UKC,maxDraft,airDraft,
    blind,visLimit,eyeAbvWL,Ho,houseAbove,
    draftOK:Tgov<=maxDraft,ukcOK:UKC>=reqUKC,airOK:airDraft<=env.overhead,visOK:blind<=visLimit};
}

/* ============================ profile (GA-quality, loaded) ============================ */
function profileGA(v,env,r,design){
  const c=r.c, L=c.LOA;
  const Tm = design? c.Tdes : r.Tm;
  const fb = c.depth - Tm;
  const tiers = design? c.deckTiers : v.L.tiers;
  const fwdT  = design? c.deckTiers : v.L.fwd;
  const fill  = design? 1.0 : v.L.fill;
  const houseAbove = tiers*TH+4, funnelAbove = tiers*TH+3;
  const stackH = tiers*TH;
  const aboveMax = Math.max(stackH, houseAbove, c.island==='two'?funnelAbove:0);
  const ml=56, mr=118, mt=64;
  const waterDepth = design? Tm+6 : env.chartDepth+env.tide;
  const X = m => ml + m*S;
  const WLy = mt + (aboveMax+fb)*S, deckY = WLy - fb*S, keelY = WLy + Tm*S;
  const stackTopY = deckY - stackH*S, dbY = keelY - c.db*S;
  const seabedY = WLy + waterDepth*S, H = seabedY + 30, W = ml + L*S + mr;
  const drpx=Tm*S, fbpx=fb*S, frpx=c.foreRise*S;
  const RE=(x,y,w,h,cl,rx=0)=>`<rect class="${cl}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"${rx?` rx="${rx}"`:''}/>`;
  const LN=(x1,y1,x2,y2,cl)=>`<line class="${cl}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  const TX=(x,y,t,cl,a='start')=>`<text class="${cl}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}">${t}</text>`;
  // hull outline
  const sf=L-c.stemRake*L, bn=sf+0.018*L, ff=L-0.055*L;
  let hull=`M ${X(0)} ${deckY}`;
  hull+=` L ${X(0.90*L)} ${deckY}`;
  hull+=` C ${X(0.95*L)} ${deckY} ${X(0.985*L)} ${deckY-frpx*0.6} ${X(L)} ${deckY-frpx}`;
  hull+=` C ${X(L)} ${(deckY-frpx+WLy)/2} ${X(sf)} ${(deckY-frpx+WLy)/2} ${X(sf)} ${WLy}`;
  hull+=` C ${X(bn)} ${WLy+0.12*drpx} ${X(bn)} ${WLy+0.30*drpx} ${X(bn)} ${WLy+0.42*drpx}`;
  hull+=` C ${X(bn)} ${WLy+0.55*drpx} ${X(L-0.02*L)} ${keelY} ${X(ff)} ${keelY}`;
  hull+=` L ${X(0.075*L)} ${keelY}`;
  hull+=` C ${X(0.055*L)} ${keelY} ${X(0.045*L)} ${keelY-0.05*drpx} ${X(0.040*L)} ${keelY-0.16*drpx}`;
  hull+=` C ${X(0.028*L)} ${WLy+0.55*drpx} ${X(0.018*L)} ${WLy+0.20*drpx} ${X(0.012*L)} ${WLy}`;
  hull+=` L ${X(0)} ${deckY} Z`;

  let s=`<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" xmlns="https://url.us.m.mimecastprotect.com/s/sbylCzp4o4s7GorpcxU77i96u7I?domain=w3.org"><style>
    .hull{fill:#f2f5f7;stroke:#16232e;stroke-width:1.5}
    .deckln{fill:none;stroke:#16232e;stroke-width:1.1}
    .db{fill:none;stroke:#8fa3ad;stroke-width:.8;stroke-dasharray:5 3}
    .sea{fill:#eaf1f6}
    .wl{stroke:#2f6f9f;stroke-width:1.4}
    .cell{fill:#e4ebf0;stroke:#33454f;stroke-width:.8}
    .cell.top{fill:#dbe6ee}
    .hold{fill:none;stroke:#9fb0b8;stroke-width:.7;stroke-dasharray:3 2.4}
    .struct{fill:#dfe6ec;stroke:#16232e;stroke-width:1.1}
    .struct2{fill:none;stroke:#7d919c;stroke-width:.7}
    .eng{fill:#f3e3d6;stroke:#a8492c;stroke-width:1}
    .er{fill:#a8492c;font:600 ${(3*S).toFixed(0)}px 'IBM Plex Mono',monospace}
    .app{fill:#c3ccd2;stroke:#16232e;stroke-width:1}
    .bed{stroke:#8a6d3b;stroke-width:1.4} .bedh{stroke:#c9b48f;stroke-width:.7}
    .dim{fill:none;stroke:#5a6b77;stroke-width:.8}
    .dimtx{fill:#5a6b77;font:600 11px 'IBM Plex Mono',monospace}
    .sight{stroke:#c0392b;stroke-width:1.2;stroke-dasharray:6 3}
    .sighttx{fill:#c0392b;font:600 11px 'IBM Plex Mono',monospace}
    .wind{fill:#38b2bf;opacity:.15}
    .ukctx{fill:#8a6d3b;font:600 11px 'IBM Plex Mono',monospace}
    .bay{fill:#2f6f9f;font:600 10px 'IBM Plex Mono',monospace}
    .tier{fill:#5a6b77;font:600 9px 'IBM Plex Mono',monospace}
    .adbay{fill:#0e7c86;font:700 10px 'IBM Plex Mono',monospace}
    .bayhit{cursor:pointer}
  </style>`;
  // sea + seabed
  s+=RE(0,WLy,W,seabedY-WLy,'sea');
  if(!design){ s+=LN(0,seabedY,W,seabedY,'bed');
    for(let x=6;x<W-6;x+=13) s+=LN(x,seabedY,x-6,seabedY+6,'bedh'); }
  s+=`<path class="hull" d="${hull}"/>`;
  // appendages
  const pxc=X(0.033*L), pyc=WLy+0.60*drpx;
  s+=`<circle class="app" cx="${pxc.toFixed(1)}" cy="${pyc.toFixed(1)}" r="${(1.2*S).toFixed(1)}"/>`;
  s+=`<ellipse class="app" cx="${pxc.toFixed(1)}" cy="${pyc.toFixed(1)}" rx="${(1.1*S).toFixed(1)}" ry="${(3.4*S).toFixed(1)}"/>`;
  s+=`<path class="app" d="M ${X(0.016*L)} ${(WLy+0.18*drpx).toFixed(1)} L ${X(0.028*L)} ${(WLy+0.20*drpx).toFixed(1)} L ${X(0.024*L)} ${(WLy+0.80*drpx).toFixed(1)} L ${X(0.012*L)} ${(WLy+0.78*drpx).toFixed(1)} Z"/>`;
  s+=`<circle class="deckln" cx="${X(0.94*L).toFixed(1)}" cy="${(WLy+0.55*drpx).toFixed(1)}" r="${(1.1*S).toFixed(1)}"/>`;
  // deck line + double bottom
  s+=LN(X(0),deckY,X(0.985*L),deckY,'deckln');
  s+=LN(X(0.06*L),dbY,X(0.95*L),dbY,'db');

  // structures
  function drawHouse(cxM,lenM,aboveM,withFunnel){
    const hx=X(cxM)-lenM*S/2, hw=lenM*S, hh=aboveM*S, hy=deckY-hh;
    let g=RE(hx,hy,hw,hh,'struct',2);
    const decks=Math.max(4,Math.round(aboveM/2.9));
    for(let d=1;d<decks;d++){const yy=deckY-d*(hh/decks); g+=LN(hx+2,yy,hx+hw-2,yy,'struct2');}
    g+=RE(hx-3*S,hy+2,3*S,2.2*S,'struct2'); g+=RE(hx+hw,hy+2,3*S,2.2*S,'struct2');
    g+=RE(hx+hw*0.12,hy-2.8*S,hw*0.76,2.8*S,'struct',1);
    const mky=hy-2.8*S; g+=RE(hx+hw*0.22,mky-0.7*S,hw*0.56,0.7*S,'struct2');
    const mmx=hx+hw*0.5, mbase=mky-0.7*S, tH=4.2*S, platY=mbase-tH;
    g+=`<path class="struct" d="M ${(mmx-1.8*S).toFixed(1)} ${mbase.toFixed(1)} L ${(mmx-0.7*S).toFixed(1)} ${platY.toFixed(1)} L ${(mmx+0.7*S).toFixed(1)} ${platY.toFixed(1)} L ${(mmx+1.8*S).toFixed(1)} ${mbase.toFixed(1)} Z"/>`;
    g+=LN(mmx-1.45*S,mbase-tH*0.30,mmx+1.05*S,mbase-tH*0.62,'struct2');
    g+=LN(mmx+1.45*S,mbase-tH*0.30,mmx-1.05*S,mbase-tH*0.62,'struct2');
    g+=RE(mmx-2.3*S,platY-0.7*S,4.6*S,0.7*S,'struct');
    g+=LN(mmx-1.9*S,platY-1.25*S,mmx+1.9*S,platY-1.25*S,'deckln');
    g+=LN(mmx,platY-0.7*S,mmx,platY-3.0*S,'deckln');
    g+=LN(mmx-1.1*S,platY-0.7*S,mmx-1.1*S,platY-2.1*S,'deckln');
    g+=LN(mmx+1.1*S,platY-0.7*S,mmx+1.1*S,platY-1.8*S,'deckln');
    if(withFunnel){const fw=hw*0.30,fx=hx+hw*0.09,fh=aboveM*0.38*S,fy=hy-fh,rk=1.5*S;
      g+=`<path class="struct" d="M ${fx.toFixed(1)} ${hy.toFixed(1)} L ${(fx+fw).toFixed(1)} ${hy.toFixed(1)} L ${(fx+fw-rk).toFixed(1)} ${fy.toFixed(1)} L ${(fx-rk).toFixed(1)} ${fy.toFixed(1)} Z"/>`;
      g+=RE(fx-rk,fy,fw,1.2*S,'struct2');
      g+=LN(fx-rk+fw*0.30,fy,fx-rk+fw*0.30,fy-1.5*S,'deckln');
      g+=LN(fx-rk+fw*0.70,fy,fx-rk+fw*0.70,fy-1.5*S,'deckln');}
    windRects.push({x:hx,y:hy-8*S,w:hw,h:deckY-(hy-8*S)});
    return g;
  }
  function drawFunnel(cxM,lenM,aboveM){
    const cx=X(cxM),casW=lenM*S,casH=aboveM*0.62*S,casX=cx-casW/2,casY=deckY-casH;
    let g=RE(casX,casY,casW,casH,'struct',1);
    const dks=Math.max(3,Math.round((aboveM*0.62)/3.0));
    for(let d=1;d<dks;d++){const yy=deckY-d*(casH/dks); g+=LN(casX+2,yy,casX+casW-2,yy,'struct2');}
    const fw=casW*0.46,fh=aboveM*S-casH,fcx=cx+casW*0.04,rk=1.9*S,fbx=fcx-fw/2,ftx=fbx-rk,fy=casY-fh;
    g+=`<path class="struct" d="M ${fbx.toFixed(1)} ${casY.toFixed(1)} L ${(fbx+fw).toFixed(1)} ${casY.toFixed(1)} L ${(ftx+fw).toFixed(1)} ${fy.toFixed(1)} L ${ftx.toFixed(1)} ${fy.toFixed(1)} Z"/>`;
    g+=RE(ftx,fy,fw,1.3*S,'struct2');
    g+=LN(ftx+fw*0.32,fy,ftx+fw*0.32,fy-1.7*S,'deckln');
    g+=LN(ftx+fw*0.68,fy,ftx+fw*0.68,fy-1.7*S,'deckln');
    windRects.push({x:casX,y:fy-1.7*S,w:casW,h:deckY-(fy-1.7*S)});
    return g;
  }
  // stacks
  const windRects=[];
  const pitch=13.4, aftM=0.02*L, foreM=0.955*L, cw=B40*S;
  const hCM=c.houseFrac*L, fCM=c.funnelFrac*L, hHalf=c.houseLen/2+3, fHalf=c.funnelLen/2+2;
  const erCM=(c.island==='two')?fCM:hCM, erHalf=0.075*L;
  const nb=Math.floor((foreM-aftM)/pitch);
  let cells='', bays=[];
  for(let i=0;i<nb;i++){
    const cm=aftM+(i+0.5)*pitch;
    if(Math.abs(cm-hCM)<hHalf) continue;
    if(c.island==='two'&&Math.abs(cm-fCM)<fHalf) continue;
    let t = cm>0.72*L ? fwdT : tiers;
    if(!design && cm<0.72*L && i%6===4 && t>3) t-=1;
    const x=X(cm)-cw/2;
    for(let k=0;k<t;k++){const y=deckY-(k+1)*TH*S; cells+=RE(x,y,cw,TH*S-0.6,(k===t-1?'cell top':'cell'));}
    windRects.push({x,y:deckY-t*TH*S,w:cw,h:t*TH*S}); bays.push({cm,t});
  }
  // in-hold dashed
  let hold='';
  if(opts.hold && !design){
    const holdH=dbY-deckY, hch=holdH/c.holdTiers;
    for(let i=0;i<nb;i++){const cm=aftM+(i+0.5)*pitch;
      if(cm<c.holdAft*L) continue; if(Math.abs(cm-erCM)<erHalf) continue;
      const x=X(cm)-cw/2;
      for(let k=0;k<c.holdTiers;k++) hold+=RE(x,deckY+k*hch,cw,hch,'hold');
    }
  }
  // engine glyph
  let eng='';
  {const eh=(dbY-deckY)*0.42, ex=X(erCM)-erHalf*S*0.62, ew=erHalf*S*1.24, ey=dbY-eh;
   eng+=RE(ex,ey,ew,eh,'eng',1);
   for(let q=0;q<6;q++) eng+=`<circle class="eng" cx="${(ex+ew*(q+0.5)/6).toFixed(1)}" cy="${(ey+eh*0.34).toFixed(1)}" r="${(1.4*S).toFixed(1)}"/>`;
   eng+=TX(X(erCM),ey-3,'E / R','er','middle');}
  s+=hold+eng+cells;
  if(c.island==='single') s+=drawHouse(hCM,c.houseLen,houseAbove,true);
  else { s+=drawFunnel(fCM,c.funnelLen,funnelAbove); s+=drawHouse(hCM,c.houseLen,houseAbove,false); }
  // foremast
  {const fmx=X(0.905*L); s+=LN(fmx,deckY,fmx,deckY-8.5*S,'deckln');
   s+=RE(fmx-1.4*S,deckY-5.4*S,2.8*S,0.7*S,'struct2');}

  // ---- overlays ----
  // windage
  if(opts.wind && !design){ s+=`<g>`;
    windRects.forEach(a=>{s+=RE(a.x,a.y,a.w,a.h,'wind');});
    s+=RE(ml,WLy-fb*S,L*S,fb*S,'wind'); s+=`</g>`; }
  // waterline + draft marks
  s+=LN(0,WLy,W,WLy,'wl');
  s+=TX(5,WLy-4,design?'DWL':'WL','dimtx');
  if(!design){s+=TX(5,WLy+13,'T '+Tm.toFixed(1)+' m','dimtx');}
  function draftMk(xm){const x=X(xm);let g=LN(x,WLy,x,keelY,'dim');
    for(let d=0;d<=Math.floor(Tm);d++){const yy=keelY-d*S,w=(d%2?2.5:4.5);g+=LN(x,yy,x+w,yy,'dim');}return g;}
  s+=draftMk(0.05*L)+draftMk(0.93*L);
  // air draft (right) — measured to the masthead, the vessel's highest fixed point
  const airTopAboveDeck = tiers*TH + 12;        // house top (+4) + mast/antenna (+8) above the deck stack
  const airDimVal = fb + airTopAboveDeck;
  const mastTopY = deckY - airTopAboveDeck*S;
  const adx=X(L)+34;
  s+=LN(adx,mastTopY,adx,WLy,'dim');
  s+=`<path class="dim" d="M ${adx-3} ${mastTopY+6} L ${adx} ${mastTopY} L ${adx+3} ${mastTopY+6}"/>`;
  s+=`<text class="dimtx" x="${adx+12}" y="${((mastTopY+WLy)/2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 ${adx+12} ${((mastTopY+WLy)/2).toFixed(1)})">air draft ${airDimVal.toFixed(1)} m</text>`;
  if(!design){
    // seabed UKC
    const ux=X(0.30*L);
    s+=LN(ux,keelY,ux,seabedY,'dim');
    s+=`<path class="dim" d="M ${ux-3} ${keelY+6} L ${ux} ${keelY} L ${ux+3} ${keelY+6}"/>`;
    s+=`<path class="dim" d="M ${ux-3} ${seabedY-6} L ${ux} ${seabedY} L ${ux+3} ${seabedY-6}"/>`;
    s+=TX(ux+7,(keelY+seabedY)/2+3,'UKC '+r.UKC.toFixed(1)+' m','ukctx');
    s+=TX(W-8,seabedY-5,'seabed '+(env.chartDepth+env.tide).toFixed(1)+' m','ukctx','end');
    // SOLAS sight line
    if(opts.sight){
      const eyeX=X(hCM), eyeY=WLy-r.eyeAbvWL*S, obsX=X(0.905*L), obsY=WLy-r.Ho*S;
      if(r.eyeAbvWL>r.Ho && isFinite(r.blind)){
        const dx=obsX-eyeX,dy=obsY-eyeY,tHit=(WLy-eyeY)/dy,hitX=eyeX+dx*tHit;
        s+=LN(eyeX,eyeY,hitX,WLy,'sight');
        s+=`<circle cx="${hitX.toFixed(1)}" cy="${WLy.toFixed(1)}" r="2.6" fill="#c0392b"/>`;
        s+=TX(Math.min(hitX,X(L)-4),WLy-6,'blind '+Math.round(r.blind)+' m','sighttx','end');
      } else { s+=LN(eyeX,eyeY,X(L),eyeY,'sight'); s+=TX(eyeX+8,eyeY-4,'no fwd sight','sighttx'); }
    }
  }
  // bay numbers (permanent) + per-bay air-draft toggle · tier labels
  {
    const orderDesc=[...bays].map(b=>b.cm).sort((a,b)=>b-a);
    const bayNoOf=cm=>2+orderDesc.indexOf(cm)*4;
    if(!design){
      // permanent bay number on every bay; click the bay to show its air draft
      bays.forEach(b=>{const no=String(bayNoOf(b.cm)).padStart(2,'0'),cx=X(b.cm);
        s+=TX(cx,stackTopY-6,no,'bay','middle');
        if(SEL.has(no)){const ad=fb+b.t*TH; s+=TX(cx,stackTopY-19,'\u2713 '+ad.toFixed(1)+' m','adbay','middle');}});
      // transparent hit box over each bay = the clickable target for air draft
      bays.forEach(b=>{const no=String(bayNoOf(b.cm)).padStart(2,'0'),cx=X(b.cm);
        s+=`<rect class="bayhit" data-bay="${no}" x="${(cx-cw/2).toFixed(1)}" y="${(stackTopY-24).toFixed(1)}" width="${cw.toFixed(1)}" height="${(deckY-(stackTopY-24)).toFixed(1)}" fill="transparent"/>`;});
    } else if(opts.labels){
      orderDesc.forEach((cm,idx)=>{s+=TX(X(cm),stackTopY-6,String(2+idx*4).padStart(2,'0'),'bay','middle');});
    }
    if(opts.labels){
      for(let t=0;t<tiers;t+=2){const yy=deckY-(t+0.5)*TH*S; s+=TX(ml-10,yy+2,String(82+t*2),'tier','middle');}
    }
  }
  s+=`</svg>`;
  return s;
}

/* ============================ render ============================ */
const el=id=>document.getElementById(id);
function ownTag(list){return list.map(o=>`<span class="ot" style="background:var(--own-${o=='b'?'bow':o=='a'?'ais':o=='v'?'ves':'load'})"></span>`).join('');}
function kpi(k,val,unit,stat,owns){
  const st=stat===null?'s-na':stat==='ok'?'s-ok':stat==='warn'?'s-warn':'s-bad';
  return `<div class="kpi"><span class="stat ${st}"></span><div class="k">${k}</div>
    <div class="v">${val}<span class="u">${unit||''}</span></div><span class="owns">${ownTag(owns)}</span></div>`;
}
function opsView(v,c,r){
  const st=b=>b?'ok':'bad', sim=isSim();
  return `
   <div class="modebar ${sim?'sim':'cur'}">
     <span class="modebadge">${sim?'● Simulation mode — exploring a what-if':'● Current condition — as declared'}</span>
     <button class="btn" id="resetbtn" ${sim?'':'disabled'}>Reset to current</button>
   </div>
   <div class="toolrow">View:
     <label class="chk"><input type="checkbox" id="o-hold" ${opts.hold?'checked':''}> in-hold</label>
     <label class="chk"><input type="checkbox" id="o-wind" ${opts.wind?'checked':''}> windage</label>
     <label class="chk"><input type="checkbox" id="o-sight" ${opts.sight?'checked':''}> visibility line</label>
     <label class="chk"><input type="checkbox" id="o-labels" ${opts.labels?'checked':''}> bay / tier</label>
   </div>
   <div class="drawing ${sim?'sim':''}">${profileGA(v,ENV,r,false)}
     <div class="cap">Loaded profile at declared draft. Blue = waterline · red dashed = SOLAS V/22 forward sight line · teal = windage area (A_L) · brown = seabed & UKC · stern shows propeller & rudder.</div>
   </div>
   <div class="kpiwrap">
     <div class="kpihdr">Drafts & air draft</div>
     <div class="kpis">
       ${kpi('Draft fwd / aft','T '+v.L.Tf.toFixed(1)+' / '+v.L.Ta.toFixed(1),'m',null,['l'])}
       ${kpi('Mean draft',r.Tm.toFixed(2),'m',null,['l'])}
       ${kpi('Trim (stern +)',(r.trim>=0?'+':'')+r.trim.toFixed(1),'m',null,['l'])}
       ${kpi('Governing draft',r.Tgov.toFixed(2),'m',st(r.draftOK),['l','v'])}
       ${kpi('Max permissible draft',r.maxDraft.toFixed(2),'m',null,['b'])}
       ${kpi('Air draft (loaded)',r.airDraft.toFixed(1),'m',st(r.airOK),['l','v'])}
       ${kpi('Overhead / crane limit',ENV.overhead.toFixed(0),'m',null,['b'])}
     </div>
     <div class="kpihdr">Under-keel & squat</div>
     <div class="kpis">
       ${kpi('UKC',r.UKC.toFixed(2),'m',r.ukcOK?'ok':'bad',['b','l','a'])}
       ${kpi('Required UKC',r.reqUKC.toFixed(2),'m',null,['b'])}
       ${kpi('Squat (Barrass)',r.squat.toFixed(2),'m',r.squat>0?(r.squat<0.6?'warn':'bad'):null,['a','v'])}
     </div>
     <div class="kpihdr">Stability / heel &nbsp;·&nbsp; Windage &amp; towage</div>
     <div class="kpis">
       ${kpi('GM (declared)',v.L.GM.toFixed(1),'m',null,['l'])}
       ${kpi('Wind heel',r.heelDeg.toFixed(2),'°',r.heelDeg<3?'ok':'warn',['b','l','v'])}
       ${kpi('Heel immersion',r.heelImm.toFixed(2),'m',null,['b','l','v'])}
       ${kpi('Windage A_L',Math.round(r.AL).toLocaleString(),'m²',null,['v','l'])}
       ${kpi('Wind force (beam)',Math.round(r.Fwind/1000),'kN',null,['b','v'])}
       ${kpi('Current force',Math.round(r.Fcur/1000),'kN',null,['b','v'])}
       ${kpi('Tugs (60 t BP, ×1.5)',r.tugs,'',r.tugs<=4?'ok':'warn',['b','v','l'])}
     </div>
     <div class="kpihdr">Bridge visibility — SOLAS V/22</div>
     <div class="kpis">
       ${kpi('Forward blind sector',isFinite(r.blind)?Math.round(r.blind):'—','m',r.visOK?'ok':'bad',['v','l'])}
       ${kpi('Limit (2·LOA / 500 m)',Math.round(r.visLimit),'m',null,['v'])}
     </div>
   </div>`;
}
function partView(v,c,r){
  const rows1=[['LOA',c.LOA.toFixed(1)+' m'],['LBP','≈ '+c.LBP+' m'],['Beam (moulded)',c.beam.toFixed(1)+' m'],
    ['Depth (moulded)',c.depth.toFixed(2)+' m'],['Design draft',c.Tdes.toFixed(1)+' m'],['Freeboard (design)',(c.depth-c.Tdes).toFixed(2)+' m']];
  const rows2=[['Air draft (design, full)',((c.depth-c.Tdes)+c.deckTiers*TH+12).toFixed(1)+' m'],['On-deck stow',c.deckTiers+' tiers × '+c.rowsDeck+' rows'],
    ['Block coeff. Cb',Cb(c).toFixed(2)],['Displacement',c.disp.toLocaleString()+' t'],
    ['Arrangement',c.island==='single'?'single island, engine aft':'two-island, engine aft'],['Capacity',c.teu]];
  const tb=rows=>rows.map(([k,val])=>`<div class="prow"><span class="k">${k}</span><span class="v">${val}</span></div>`).join('');
  return `<div class="part">
    <div class="parttab"><div>${tb(rows1)}</div><div>${tb(rows2)}</div></div>
    <div class="drawing" style="margin-top:12px">${profileGA(v,ENV,r,true)}
      <div class="cap">As-designed GA — full stow at design draft. This is the canonical geometry the operating picture and every calculation read from.</div></div>
  </div>`;
}
function render(){
  const v=VESSELS[cur], c=CLASS[v.cls], r=calc(v,ENV);
  el('pophead').innerHTML=`
    <span class="nm">${v.name}</span>
    <span class="cls">${c.label} · ${c.teu}</span>
    <span class="id">MMSI <b>${v.mmsi}</b> · IMO <b>${v.imo}</b> · CS <b>${v.cs}</b> · ${v.flag}</span>
    <span class="id">BAPLIE <b class="mono">${v.baplie}</b> <span style="color:var(--muted)">(preloaded)</span></span>`;
  el('view').innerHTML = sub==='ops'? opsView(v,c,r) : partView(v,c,r);
  if(sub==='ops'){['hold','wind','sight','labels'].forEach(k=>{const e=el('o-'+k); if(e)e.onchange=()=>{opts[k]=e.checked;render();};});
    const rb=el('resetbtn'); if(rb) rb.onclick=()=>{Object.assign(ENV,BASE.env);Object.assign(VESSELS[cur].L,BASE.load[cur]);buildControls();render();};
    document.querySelectorAll('#view .bayhit').forEach(h=>h.onclick=()=>{const b=h.dataset.bay; SEL.has(b)?SEL.delete(b):SEL.add(b); render();});}
}

/* ---- controls ---- */
function slider(id,lab,unit,min,max,step,val){return `<div class="ctl"><label>${lab}<b><span id="${id}v">${val}</span> ${unit}</b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;}
function buildControls(){
  const v=VESSELS[cur], c=CLASS[v.cls];
  el('controls').innerHTML=`
   <div class="col bow"><h3>Environment &amp; berth</h3>
     ${slider('chartDepth','Charted depth','m',8,22,0.1,ENV.chartDepth)}
     ${slider('tide','Tide','m',-1,3,0.1,ENV.tide)}
     ${slider('windKn','Wind speed','kn',0,50,1,ENV.windKn)}
     ${slider('windDir','Wind dir (90=beam)','°',0,180,5,ENV.windDir)}
     ${slider('curKn','Current','kn',0,3,0.1,ENV.curKn)}
     ${slider('overhead','Overhead limit','m',30,70,1,ENV.overhead)}</div>
   <div class="col ais"><h3>AIS · position &amp; course</h3>
     ${slider('sogKn','Speed over ground','kn',0,16,0.5,ENV.sogKn)}
     <div class="ro">COG <b>${ENV.cog}°</b></div><div class="ro">Heading <b>${ENV.heading}°</b></div>
     <div class="ro">Nav status <b>${ENV.sogKn>0.5?'under way':'moored'}</b></div></div>
   <div class="col load"><h3>Loading condition</h3>
     ${slider('Tf','Declared draft fwd','m',c.Tdes-6,c.Tdes+1,0.1,v.L.Tf)}
     ${slider('Ta','Declared draft aft','m',c.Tdes-6,c.Tdes+1,0.1,v.L.Ta)}
     ${slider('GM','GM','m',0.6,6,0.1,v.L.GM)}
     ${slider('tiers','Deck tiers (max)','',3,c.deckTiers,1,v.L.tiers)}
     ${slider('fwd','Forward tiers','',1,c.deckTiers,1,v.L.fwd)}</div>
   <div class="col ves"><h3>Vessel particulars</h3>
     <div class="ro">LOA <b>${c.LOA} m</b></div><div class="ro">Beam <b>${c.beam} m</b></div>
     <div class="ro">Depth <b>${c.depth} m</b></div><div class="ro">Cb <b>${Cb(c).toFixed(2)}</b></div>
     <div class="ro">Displacement <b>${c.disp.toLocaleString()} t</b></div>
     <div class="ro">GA geometry <b>class ${v.cls}</b></div></div>`;
  const bE=(id,key,dec)=>{const e=el(id); if(!e)return; e.oninput=()=>{ENV[key]=+e.value; el(id+'v').textContent=dec?(+e.value).toFixed(dec):e.value; render(); if(key==='sogKn')buildControls();};};
  ['chartDepth','tide','curKn','overhead'].forEach(k=>bE(k,k,1)); bE('windKn','windKn',0); bE('windDir','windDir',0); bE('sogKn','sogKn',1);
  const bL=(id,key,dec)=>{const e=el(id); if(!e)return; e.oninput=()=>{VESSELS[cur].L[key]=+e.value; el(id+'v').textContent=dec?(+e.value).toFixed(dec):e.value; render();};};
  ['Tf','Ta','GM'].forEach(k=>bL(k,k,1)); ['tiers','fwd'].forEach(k=>bL(k,k,0));
}

/* ---- tabs / toggles ---- */
function buildTabs(){const _t=el('tabs'); if(!_t)return; _t.innerHTML=VESSELS.map((v,i)=>`<div class="tab ${i===cur?'on':''}" data-i="${i}">${v.name}</div>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>{cur=+t.dataset.i;SEL.clear();buildTabs();buildControls();render();});}
document.querySelectorAll('.stab').forEach(t=>t.onclick=()=>{sub=t.dataset.v;document.querySelectorAll('.stab').forEach(x=>x.classList.toggle('on',x===t));render();});
el('theme').onclick=()=>{const rt=document.documentElement,cu=rt.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');rt.setAttribute('data-theme',cu==='dark'?'light':'dark');};

/* ---- live data feed (host ArcGIS → popup) -----------------------------------
   Feed environment + AIS at open time via URL query params, e.g.
     pacific_envoy.html?depth=16.5&tide=1.2&windKn=18&windDir=90&curKn=0.5&sog=12&cog=284&heading=286&overhead=62
   ...or push live updates while the popup stays open (e.g. an embedded iframe):
     iframe.contentWindow.postMessage({type:'vesselFeed',payload:{tide:1.4,sog:11}}, '*')
   ...or same-origin script call:
     window.vesselFeed({tide:1.4, sog:11})
   Recognised keys (any subset; unknown keys ignored):
     depth  charted depth (m)      tide   height on datum (m)
     windKn wind speed (kn)        windDir angle rel. to ship, 90 = beam (deg)
     curKn  current (kn)           overhead crane/air-draft limit (m) — optional
     sog    speed over ground (kn) cog    course over ground (deg)
     heading heading (deg)         Tf/Ta declared draft fwd/aft (m)  GM  GM (m)
     tiers  deck tiers             fwd    forward tiers
   Values not fed keep their built-in defaults.                                  */
function applyFeed(src){
  if(!src) return false;
  const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null;};
  const envMap={depth:'chartDepth',tide:'tide',windKn:'windKn',windDir:'windDir',curKn:'curKn',overhead:'overhead',sog:'sogKn',cog:'cog',heading:'heading'};
  let env=false,load=false;
  for(const k in envMap){ if(src[k]!=null){const val=num(src[k]); if(val!=null){ENV[envMap[k]]=val; env=true;}} }
  const L=VESSELS[cur].L;
  ['Tf','Ta','GM','tiers','fwd'].forEach(k=>{ if(src[k]!=null){const val=num(src[k]); if(val!=null){L[k]=val; load=true;}} });
  if(env)  BASE.env={...ENV};                       // fed values define the current condition
  if(load) BASE.load[cur]={...VESSELS[cur].L};
  return env||load;
}
(function(){ const p=new URLSearchParams(location.search),o={}; p.forEach((v,k)=>o[k]=v); applyFeed(o); })();
window.vesselFeed=o=>{ if(applyFeed(o)){ buildControls(); render(); } };
window.addEventListener('message',e=>{ const d=e.data;
  if(d&&(d.type==='vesselFeed'||d.type==='twinFeed')&&d.payload){ if(applyFeed(d.payload)){ buildControls(); render(); } } });

buildTabs(); buildControls(); render();
</script>
